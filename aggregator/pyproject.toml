[project]
name = "zelfwonen-aggregator"
version = "0.1.0"
description = "Inbound listing aggregator for ZelfWonen (Funda + Kamernet, pluggable adapters)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "asyncpg>=0.30,<1",
    "boto3>=1.38,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "selectolax>=0.3,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=0.26,<2",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI-style default args in dataclasses are intentional here
