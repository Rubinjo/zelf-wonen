# Run from web/: docker compose --env-file .env.production up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to your public hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - aggregated_media:/srv/aggregated-media:ro
      - web_uploads:/srv/uploads:ro
    depends_on:
      web:
        condition: service_healthy
    networks: [frontend]

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
    image: ${WEB_IMAGE:-zelfwonen-web:local}
    restart: unless-stopped
    init: true
    # Deployment validates a staged secret file before promoting it atomically.
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
      BETTER_AUTH_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random Better Auth secret}
      IP_HASH_SALT: ${IP_HASH_SALT:?Set an independent random IP hash salt}
      DATABASE_URL: postgresql://zelfwonen:${POSTGRES_PASSWORD:?Set a URL-safe database password}@postgres:5432/zelfwonen?schema=public
      ML_ESTIMATOR_URL: http://estimator:8000
      ML_ESTIMATOR_TOKEN: ${ML_ESTIMATOR_TOKEN:?Set an estimator service token}
      AGGREGATED_MEDIA_BASE_URL: ${AGGREGATED_MEDIA_BASE_URL:-/aggregated-media}
      AGGREGATOR_ENRICHMENT_TOKEN: ${AGGREGATOR_ENRICHMENT_TOKEN:-${ML_ESTIMATOR_TOKEN}}
    volumes:
      - web_data:/app/.data
      - web_uploads:/app/public/uploads
      - aggregated_media:/app/public/aggregated-media:ro
    depends_on:
      postgres:
        condition: service_healthy
      estimator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [frontend, backend]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zelfwonen
      POSTGRES_USER: zelfwonen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe database password}
    volumes:
      - zelfwonen_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zelfwonen -d zelfwonen"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]

  estimator:
    build:
      context: ../estimator
    image: ${ESTIMATOR_IMAGE:-zelfwonen-estimator:local}
    restart: unless-stopped
    init: true
    environment:
      ENVIRONMENT: production
      ML_ESTIMATOR_TOKEN: ${ML_ESTIMATOR_TOKEN:?Set an estimator service token}
    healthcheck:
      # Readiness includes the dataset, not just a responding HTTP process.
      test: ["CMD", "python", "-c", "import json, urllib.request; data = json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=2)); assert data['status'] == 'ok', 'Estimator dataset unavailable'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [backend]

  # Explicit backup/restore helper; never started with the application stack.
  storage-maintenance:
    image: ${WEB_IMAGE:-zelfwonen-web:local}
    profiles: ["maintenance"]
    user: "0:0"
    entrypoint: ["tar"]
    working_dir: /app
    network_mode: none
    volumes:
      - web_data:/app/.data
      - web_uploads:/app/public/uploads
      - aggregated_media:/app/public/aggregated-media

  # Enable explicitly with --profile aggregator; this worker makes outbound requests.
  aggregator:
    build:
      context: ../aggregator
    image: ${AGGREGATOR_IMAGE:-zelfwonen-aggregator:local}
    restart: "no"
    command: ["sync"]
    init: true
    profiles: ["aggregator"]
    environment:
      AGGREGATOR_DATABASE_URL: postgresql://zelfwonen:${POSTGRES_PASSWORD:?Set a URL-safe database password}@postgres:5432/zelfwonen
      AGGREGATOR_NEIGHBORHOOD_ENRICHMENT_URL: http://web:3000/api/internal/aggregator/neighborhood
      AGGREGATOR_NEIGHBORHOOD_ENRICHMENT_TOKEN: ${AGGREGATOR_ENRICHMENT_TOKEN:-${ML_ESTIMATOR_TOKEN}}
      AGGREGATOR_SYNC_INTERVAL_SECONDS: ${AGGREGATOR_SYNC_INTERVAL_SECONDS:-21600}
      AGGREGATOR_PROXY_URLS: ${AGGREGATOR_PROXY_URLS:-}
      AGGREGATOR_ENABLED_SOURCES: ${AGGREGATOR_ENABLED_SOURCES:-FUNDA,KAMERNET}
      AGGREGATOR_FUNDA_TRANSPORT: ${AGGREGATOR_FUNDA_TRANSPORT:-chrome}
      AGGREGATOR_FUNDA_SITEMAP_URL: ${AGGREGATOR_FUNDA_SITEMAP_URL:-}
      AGGREGATOR_KAMERNET_SEARCH_URL: ${AGGREGATOR_KAMERNET_SEARCH_URL:-}
      AGGREGATOR_FUNDA_SEARCH_URLS: ${AGGREGATOR_FUNDA_SEARCH_URLS:-https://www.funda.nl/zoeken/koop?selected_area=%5B%22nl%22%5D|https://www.funda.nl/zoeken/huur?selected_area=%5B%22nl%22%5D}
      AGGREGATOR_KAMERNET_SEARCH_URLS: ${AGGREGATOR_KAMERNET_SEARCH_URLS:-https://kamernet.nl/huren/kamer-nederland|https://kamernet.nl/huren/appartement-nederland|https://kamernet.nl/huren/studio-nederland}
      AGGREGATOR_MAX_LISTINGS_PER_SOURCE: ${AGGREGATOR_MAX_LISTINGS_PER_SOURCE:-100000}
      AGGREGATOR_POLITE_DELAY_SECONDS: ${AGGREGATOR_POLITE_DELAY_SECONDS:-5}
      AGGREGATOR_USER_AGENTS: ${AGGREGATOR_USER_AGENTS:-zelfwonen-aggregator/0.1}
      AGGREGATOR_RESPECT_ROBOTS: "true"
      AGGREGATOR_DISCOVERY_PAGE_BATCH_SIZE: ${AGGREGATOR_DISCOVERY_PAGE_BATCH_SIZE:-20}
      AGGREGATOR_MAX_PAGES_PER_SEARCH: ${AGGREGATOR_MAX_PAGES_PER_SEARCH:-1000}
      AGGREGATOR_DETAIL_BATCH_SIZE: ${AGGREGATOR_DETAIL_BATCH_SIZE:-500}
      AGGREGATOR_MAX_IMAGES_PER_LISTING: ${AGGREGATOR_MAX_IMAGES_PER_LISTING:-50}
      AGGREGATOR_SOURCE_TIMEOUT_SECONDS: ${AGGREGATOR_SOURCE_TIMEOUT_SECONDS:-14400}
      AGGREGATOR_SOURCE_COOLDOWN_SECONDS: ${AGGREGATOR_SOURCE_COOLDOWN_SECONDS:-21600}
      AGGREGATOR_MAX_SOURCE_COOLDOWN_SECONDS: ${AGGREGATOR_MAX_SOURCE_COOLDOWN_SECONDS:-604800}
      AGGREGATOR_EXPIRE_MISSING: ${AGGREGATOR_EXPIRE_MISSING:-false}
      AGGREGATOR_STATUS_FILE: /app/state/status.json
      AGGREGATOR_IMAGE_STORAGE_MODE: ${AGGREGATOR_IMAGE_STORAGE_MODE:-local}
      AGGREGATOR_LOCAL_MEDIA_DIR: /app/media
      AGGREGATOR_OBJECT_STORAGE_ENDPOINT_URL: ${AGGREGATOR_OBJECT_STORAGE_ENDPOINT_URL:-}
      AGGREGATOR_OBJECT_STORAGE_BUCKET: ${AGGREGATOR_OBJECT_STORAGE_BUCKET:-zelfwonen-listings}
      AGGREGATOR_OBJECT_STORAGE_REGION: ${AGGREGATOR_OBJECT_STORAGE_REGION:-auto}
      AGGREGATOR_OBJECT_STORAGE_ACCESS_KEY_ID: ${AGGREGATOR_OBJECT_STORAGE_ACCESS_KEY_ID:-}
      AGGREGATOR_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${AGGREGATOR_OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
    volumes:
      - aggregated_media:/app/media
      - aggregator_state:/app/state
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, outbound]

networks:
  frontend:
  backend:
    internal: true
  outbound:

volumes:
  aggregator_state:
  zelfwonen_postgres_data:
  web_data:
  web_uploads:
  aggregated_media:
  caddy_data:
  caddy_config:
